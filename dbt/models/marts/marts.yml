version: 2

models:
  - name: dim_wellbeing_indicator_answer
    description: Catalogue of curated indicators, interpretation notes, and ordered answer rules.
    columns:
      - name: question_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wellbeing_indicator_catalog')
                field: question_code
      - name: answer_value
        data_tests: [not_null]
      - name: answer_display_order
        data_tests: [not_null]
  - name: mart_school_wellbeing_trend
    description: Auditable school wellbeing indicators by fictional school and survey period.
    columns:
      - name: trust_id
        data_tests: [not_null]
      - name: school_id
        data_tests: [not_null]
      - name: survey_period
        data_tests: [not_null]
      - name: question_code
        data_tests: [not_null]
      - name: eligible_submission_count
        data_tests: [not_null]
  - name: mart_question_response_distribution
    description: Aggregate answer distribution by fictional school, period, and question.
    columns:
      - name: trust_id
        data_tests: [not_null]
      - name: school_id
        data_tests: [not_null]
      - name: question_code
        data_tests: [not_null]
      - name: answer_value
        data_tests: [not_null]
      - name: response_count
        description: Null when the cohort is suppressed; otherwise the aggregate answer count.
  - name: mart_support_signal_summary
    description: Aggregate, non-diagnostic product support signals derived from adverse-response rules.
    columns:
      - name: trust_id
        data_tests: [not_null]
      - name: school_id
        data_tests: [not_null]
      - name: support_signal_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [emotional_wellbeing, peer_relationships, safety, school_support, physical_wellbeing]
      - name: product_signal_level
        data_tests:
          - accepted_values:
              arguments:
                values: [lower, watch, elevated]
  - name: mart_data_freshness
    description: Aggregate load and source timestamps by fictional trust.
    columns:
      - name: trust_id
        data_tests: [not_null, unique]
      - name: last_loaded_at
        data_tests: [not_null]
  - name: mart_school_indicator_analysis
    description: Suppression-aware school indicator metrics with prior-period and trust comparisons.
    columns:
      - name: trust_id
        data_tests: [not_null]
      - name: school_id
        data_tests: [not_null]
      - name: survey_period
        data_tests: [not_null]
      - name: question_code
        data_tests: [not_null]
      - name: coverage_status
        data_tests:
          - accepted_values:
              arguments:
                values: [adequate, limited, suppressed]
      - name: movement_status
        data_tests:
          - accepted_values:
              arguments:
                values: [no_comparison, worsening, improving, stable]
  - name: mart_school_category_analysis
    description: Weighted aggregate question-response summaries by school and wellbeing category.
    columns:
      - name: trust_id
        data_tests: [not_null]
      - name: school_id
        data_tests: [not_null]
      - name: category_code
        data_tests: [not_null]
      - name: survey_period
        data_tests: [not_null]
  - name: mart_school_change_drivers
    description: Question-level decomposition of each school category's period movement.
    columns:
      - name: school_id
        data_tests: [not_null]
      - name: category_code
        data_tests: [not_null]
      - name: question_code
        data_tests: [not_null]
      - name: driver_rank
        data_tests: [not_null]
