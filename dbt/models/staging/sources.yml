version: 2

sources:
  - name: raw
    database: SCHOOL_WELLBEING_DEMO
    schema: RAW
    tables:
      - name: mongo_wellbeing_submissions
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        columns:
          - name: envelope
            data_tests: [not_null]
          - name: source_file
            data_tests: [not_null]
          - name: source_file_row_number
            data_tests: [not_null]

  - name: governance
    database: SCHOOL_WELLBEING_DEMO
    schema: GOVERNANCE
    tables:
      - name: pipeline_runs
        columns:
          - name: run_id
            data_tests: [not_null, unique]
          - name: batch_id
            data_tests: [not_null]
          - name: source_file
            data_tests: [not_null]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [RUNNING, SUCCEEDED, FAILED]
          - name: expected_row_count
            data_tests: [not_null]
